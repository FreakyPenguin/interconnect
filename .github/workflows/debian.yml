name: Debian packages

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * *'

permissions:
  contents: read

concurrency:
  # Every push must finish so it can publish to dev, even during a busy series.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Check Linux release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/linux.yml

  macos:
    name: Build macOS release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/macos.yml

  build:
    name: Build Debian stable (amd64)
    runs-on: ubuntu-24.04
    container: debian:stable-slim
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 dpkg-dev desktop-file-utils \
            build-essential cmake ninja-build pkg-config clang libclang-dev \
            libsqlite3-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" show active-toolchain
          "$CARGO_HOME/bin/rustc" --version --verbose

      - name: Cache compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep native build environments and profiles in separate caches.
          key: debian-stable-release
          cache-bin: false

      - name: Build release client
        run: cargo build --locked --release --bin interconnect

      - name: Package client
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          desktop-file-validate packaging/debian/interconnect.desktop
          if [[ -n "$RELEASE_TAG" ]]; then
            bash scripts/package-linux-release.sh "$RELEASE_TAG" target/release/interconnect
          else
            version=$(python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          base, separator, metadata = version.partition("+")
          version = base.replace("-", "~", 1) + separator + metadata
          run = os.environ["GITHUB_RUN_NUMBER"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          commit = os.environ["GITHUB_SHA"][:12]
          print(f"{version}+dev.{run}.{attempt}.g{commit}")
          PY
            )
            bash scripts/package-debian.sh "$version" target/release/interconnect
          fi
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          dpkg-deb --extract target/debian/*.deb "$verify_dir/debian"
          bash scripts/release-notices.sh check "$verify_dir/debian/usr/share/doc/interconnect"
          if [[ -n "$RELEASE_TAG" ]]; then
            tar -xzf target/linux-release/*.tar.gz -C "$verify_dir"
            bash scripts/release-notices.sh check "$verify_dir"/interconnect-*-linux-x86_64
          fi

      - name: Upload bleeding-edge package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Interconnect-debian-amd64-${{ github.sha }}
          path: target/debian/*.deb
          # Raw uploads ignore `name`; install jobs need this stable artifact name.
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload tagged release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Interconnect-linux-release-${{ github.sha }}
          path: target/linux-release/*
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  install:
    name: Check installation on Debian ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [stable, testing]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install artifact action runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates libstdc++6

      - name: Download package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Interconnect-debian-amd64-${{ github.sha }}
          path: downloads

      - name: Install in a clean runtime container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./downloads/*.deb desktop-file-utils
          test -x /usr/bin/interconnect
          desktop-file-validate /usr/share/applications/interconnect.desktop
          test -s /usr/share/icons/hicolor/scalable/apps/interconnect.svg
          test -s /usr/share/icons/hicolor/256x256/apps/interconnect.png
          ldd /usr/bin/interconnect > /tmp/interconnect-libraries.txt
          cat /tmp/interconnect-libraries.txt
          if grep -q 'not found' /tmp/interconnect-libraries.txt; then
            exit 1
          fi

  publish-dev:
    name: Publish Debian dev channel
    if: github.event_name == 'push'
    needs: [build, install]
    uses: ./.github/workflows/forgejo-debian.yml
    with:
      channel: dev
      artifact-name: Interconnect-debian-amd64-${{ github.sha }}
    secrets:
      FORGEJO_REPO_TOKEN: ${{ secrets.FORGEJO_REPO_TOKEN }}

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, install, macos, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Linux release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Interconnect-linux-release-${{ github.sha }}
          path: downloads

      - name: Download macOS release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Interconnect-macos-arm64-${{ github.sha }}
          path: downloads

      - name: Include macOS bundle in checksums and verify assets
        working-directory: downloads
        run: |
          test -s Interconnect-macos-arm64.tar.gz
          sha256sum Interconnect-macos-arm64.tar.gz >> SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/v${version}.md"
          test -s "$notes"
          args=(--verify-tag --notes-file "$notes" --title "Interconnect $RELEASE_TAG")
          if [[ "${version%%+*}" == *-* ]]; then
            args+=(--prerelease)
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          gh release create "$RELEASE_TAG" downloads/* "${args[@]}"

  publish-main:
    name: Publish Debian main channel
    if: needs.release.outputs.prerelease == 'false'
    needs: release
    # GITHUB_TOKEN-created releases do not trigger another release workflow.
    uses: ./.github/workflows/forgejo-debian.yml
    with:
      channel: main
      release-tag: ${{ github.ref_name }}
    secrets:
      FORGEJO_REPO_TOKEN: ${{ secrets.FORGEJO_REPO_TOKEN }}
