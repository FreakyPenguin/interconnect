name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev \
            libssl-dev libsqlite3-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core fonts-noto-color-emoji dbus-daemon

      - name: Update repository Rust toolchain
        run: |
          rustup update stable
          rustup show active-toolchain
          rustc --version --verbose

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-downloads-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build desktop client
        run: cargo build --locked --bin interconnect

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
