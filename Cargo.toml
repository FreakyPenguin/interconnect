[package]
name = "interconnect"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "=0.9.1"
iced = { version = "=0.14.0", default-features = false, features = ["tokio", "wayland", "wgpu", "tiny-skia", "advanced", "canvas", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs", "sso-login", "socks"] }
matrix-sdk-common = { version = "=0.19.1", default-features = false }
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
matrix-sdk-store-encryption = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "=1.13.3"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratex-parser = "=0.1.16"
ratex-layout = "=0.1.16"
ratex-types = "=0.1.16"
ratex-render = { version = "=0.1.16", features = ["embed-fonts"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
rand = "0.9"
zeroize = "1"
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
mime_guess = "2"
tempfile = "3"
arboard = { version = "=3.7.0", features = ["wayland-data-control"] }
linkify = "0.10.0"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "6.3", default-features = false, features = ["tokio", "service", "proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = { version = "=2.17.0", default-features = false }

[dev-dependencies]
iced_tiny_skia = { version = "=0.14.1", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false }
wiremock = "0.6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Secret Service uses zbus 5; isolated migration fixtures supply its connection.
zbus-secret-service = { package = "zbus", version = "=5.19.0", default-features = false, features = ["tokio"] }

[profile.dev]
debug = 0

# Raster conversion and scaling run on the UI thread, including debug builds.
[profile.dev.package.iced_tiny_skia]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

# Iced 0.14 has no public switch for the editor's blink timer.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
iced_widget = { path = "vendor/iced_widget" }

# Wayland file drops and pane hit-testing; see docs/architecture/winit-file-drops.md.
winit = { git = "https://github.com/FreakyPenguin/winit.git", rev = "752d80adf83bca01e2992f7e2ff6c7baa78444a4" }
