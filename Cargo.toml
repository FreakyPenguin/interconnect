[package]
name = "chatclient"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
iced = { version = "=0.14.0", default-features = false, features = ["tokio", "wayland", "tiny-skia", "advanced"] }
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs", "sso-login"] }
matrix-sdk-common = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

secret-service = { version = "=5.1.0", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.dev]
debug = 0
