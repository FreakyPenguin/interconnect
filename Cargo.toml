[package]
name = "chatclient"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iced = { version = "=0.14.0", default-features = false, features = ["tokio", "wayland", "wgpu", "tiny-skia", "advanced", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs", "sso-login"] }
matrix-sdk-common = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

secret-service = { version = "=5.1.0", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
rand = "0.9"
zeroize = "1"

[dev-dependencies]
iced_tiny_skia = { version = "=0.14.1", default-features = false }
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
tempfile = "3"
tiny-skia = { version = "=0.11.4", default-features = false }
wiremock = "0.6"

[profile.dev]
debug = 0

# Raster conversion and scaling run on the UI thread, including debug builds.
[profile.dev.package.iced_tiny_skia]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

# Iced 0.14 has no public switch for the editor's blink timer.
[patch.crates-io]
iced_widget = { path = "vendor/iced_widget" }
