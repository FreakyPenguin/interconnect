# Interconnect settings. Reload in Settings after editing this file.
version = 1

[notifications]
# Desktop alerts follow the account's Matrix push rules while the app is running.
enabled = true
# Include room, sender, and message text. false uses a generic private alert.
show_preview = true

[navigation]
# Initial visibility only; the room-list button still toggles it during use.
show_room_list = true
# Show unread rooms at the top, in addition to their usual sections.
show_unread_section = true

[appearance]
# Center room content in an 840 px column. Disable to use the full pane width.
limit_room_width = true

[composer]
# "ctrl_enter": Enter inserts a newline; Ctrl+Enter sends.
# "enter": Enter sends; Shift+Enter inserts a newline. Ctrl+Enter also sends.
send_shortcut = "ctrl_enter"

[graphics]
# Both settings apply on the next launch.
# false forces the CPU renderer, including when ICED_BACKEND requests wgpu.
gpu_enabled = true
# Prefer a lower-power GPU when available; false prefers higher performance.
# An explicit WGPU_POWER_PREF environment value takes priority.
low_power = true

[media]
# GIFs stay still until Play is clicked in the image viewer.
# "once": one loop. "duration": repeat for gif_seconds, ignoring file loop counts.
gif_playback = "once"
# Whole seconds, from 1 to 300. Used only with "duration".
gif_seconds = 5
